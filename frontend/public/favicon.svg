<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#1e3a5f"/>
  <!-- Blueprint document -->
  <rect x="22" y="18" width="56" height="68" rx="4" fill="#1d4ed8" opacity="0.3" stroke="#60a5fa" stroke-width="2"/>
  <!-- Blueprint grid lines -->
  <line x1="22" y1="38" x2="78" y2="38" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <line x1="22" y1="58" x2="78" y2="58" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <line x1="42" y1="18" x2="42" y2="86" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <line x1="62" y1="18" x2="62" y2="86" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <!-- Building outline on blueprint -->
  <rect x="34" y="42" width="32" height="28" fill="none" stroke="#93c5fd" stroke-width="3"/>
  <rect x="44" y="55" width="12" height="15" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
  <!-- Roof triangle -->
  <polyline points="30,42 50,26 70,42" fill="none" stroke="#93c5fd" stroke-width="3"/>
  <!-- Pencil icon top-right -->
  <rect x="67" y="15" width="6" height="16" rx="2" fill="#fbbf24" transform="rotate(45 70 23)"/>
</svg>
